<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linen & Co — Bedsheets & Bandanas</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="logo">Linen & Co</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button class="menu-toggle" id="menuToggle">&#9776;</button>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Rest in something beautiful.</h1>
      <p>Handpicked bedsheets and bandanas — soft, durable, and yours.</p>
      <a href="shop.html" class="btn">Shop Now</a>
    </div>
  </section>

  <!-- Featured Products -->
  <section class="featured">
    <h2>Featured Products</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="images/sheet-1.jpg" alt="Cotton Bedsheet" />
        <h3>Pure Cotton Bedsheet</h3>
        <p class="price">Rs. 2,500</p>
        <a href="contact.html" class="btn-outline">Order Now</a>
      </div>
      <div class="product-card">
        <img src="images/bandana-1.jpg" alt="Paisley Bandana" />
        <h3>Paisley Bandana</h3>
        <p class="price">Rs. 450</p>
        <a href="contact.html" class="btn-outline">Order Now</a>
      </div>
      <!-- Add more cards as needed -->
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Linen & Co. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
