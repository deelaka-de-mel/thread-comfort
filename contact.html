<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Thread & Comfort</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">Thread & Comfort</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button class="menu-toggle" id="menuToggle">&#9776;</button>
  </nav>

  <main class="contact-page">
    <div class="contact-wrap">
      <h1>Place an Order</h1>
      <p class="contact-sub">Browse the catalogue, pick what you like, and message us on WhatsApp — we'll confirm availability and arrange delivery.</p>

      <!-- Shown only when arriving from a product's "Inquire" button -->
      <div class="inquiry-item" id="inquiryItem" style="display:none;">
        You're inquiring about: <strong id="inquiryItemName"></strong>
      </div>

      <a href="#" id="whatsappBtn" class="btn whatsapp-btn" target="_blank" rel="noopener">
        💬 Order via WhatsApp
      </a>
    </div>
  </main>

  <footer>
    <p>© 2026 Thread & Comfort. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
